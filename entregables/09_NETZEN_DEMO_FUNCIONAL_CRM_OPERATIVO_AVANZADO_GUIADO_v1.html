    <style>
      .demo-notice{position:relative;z-index:1100;background:#17191f;color:#fff;border-bottom:3px solid #aa0000;padding:11px 20px;font-family:Lato,Arial,sans-serif}
      .demo-notice__inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
      .demo-notice__tag{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 10px;color:#fff;font:700 10px/1 Montserrat,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}

    <script>
      (() => {
        const STORAGE_KEY = 'netzen-demo-crm-v1';
        const now = new Date('2026-09-30T16:30:00-06:00');
        const isoAgo = (hours) => new Date(now.getTime() - hours * 3600000).toISOString();
        const seed = [
          ['DEMO-001','Mariana Torres','Expansión Norte','Directora comercial','mariana.torres@example.com','+52 55 0000 0101','MX','Franquicias','B','P1',91,'propuesta','Ana López',2,'Busca abrir 12 sucursales durante el próximo año.'],
          ['DEMO-002','Carlos Mendoza','Grupo Horizonte','Fundador','carlos.mendoza@example.com','+52 55 0000 0102','MX','Venta directa','B','P2',76,'contactado','Irving',6,'Presupuesto en revisión; solicita una llamada de seguimiento.'],
          ['DEMO-003','Sofía Ramírez','Mercado Central','Gerente de crecimiento','sofia.ramirez@example.com','+52 55 0000 0103','MX','Retail','C','P2',71,'calificado','Irving',18,'Tiene equipo interno y ventana de decisión de tres meses.'],
          ['DEMO-004','Diego Castillo','Comercial Delta','Coordinador','diego.castillo@example.com','+52 55 0000 0104','CO','E-commerce','C','P3',52,'nuevo','Ana López',28,'Interés exploratorio; falta confirmar presupuesto.'],
          ['DEMO-005','Valeria Cruz','Punto Uno','Propietaria','valeria.cruz@example.com','+52 55 0000 0105','MX','Punto de venta','A','P1',86,'contactado','Irving',4,'Decisora final con necesidad inmediata de implementación.'],
          ['DEMO-006','Andrés Vega','Impulso Regional','Director','andres.vega@example.com','+52 55 0000 0106','PE','Multinivel','D','P3',48,'nurture','Ana López',80,'Proyecto temprano; retomar el siguiente trimestre.'],
          ['DEMO-007','Fernanda Ruiz','Nova Retail','CEO','fernanda.ruiz@example.com','+52 55 0000 0107','MX','Retail','B','P2',68,'cerrado_ganado','Irving',120,'Implementación aprobada.'],
          ['DEMO-008','Luis Herrera','Proyecto Prisma','Consultor','luis.herrera@example.com','+52 55 0000 0108','ES','Franquicias','E','P4',29,'cerrado_perdido','Ana López',160,'No cuenta con presupuesto en el periodo actual.'],
          ['DEMO-009','Natalia Flores','Estrategia Sur','Gerente general','natalia.flores@example.com','+52 55 0000 0109','MX','Venta directa','A','P2',73,'propuesta','Irving',10,'Cotización enviada; espera aprobación del consejo.'],
          ['DEMO-010','Miguel Santos','Origen Digital','Líder de operaciones','miguel.santos@example.com','+52 55 0000 0110','MX','E-commerce','D','PENDIENTE',null,'nuevo','Ana López',40,'Información pendiente de validación.']
        ].map((x, i) => ({
          lead_id:x[0], full_name:x[1], company_name:x[2], job_title:x[3], work_email:x[4], whatsapp:x[5], country_code:x[6],
          business_model:x[7], route_code:x[8], category:x[9], score_priority:x[10], lifecycle_stage:x[11], owner:x[12],
          created_at:isoAgo(x[13] + 8), updated_at:isoAgo(Math.max(1,x[13])), last_touch_at:x[11] === 'nuevo' ? '' : isoAgo(x[13]),
          next_action:x[11] === 'propuesta' ? 'Dar seguimiento a la propuesta' : 'Confirmar siguiente paso', notes:x[14], flags:'',
          score_alignment:x[9] === 'P1' ? 92 : x[9] === 'P2' ? 74 : 55, score_potential:x[10] || 40,
          score_intent:x[9] === 'P1' ? 94 : x[9] === 'P2' ? 72 : 45, score_confidence:x[9] === 'PENDIENTE' ? 35 : 88,
          score_reason:x[9] === 'P1' ? 'Muestra intención alta, capacidad de decisión y una necesidad inmediata.' : 'La prioridad combina alineación, potencial, intención y confianza de los datos.',
          prospect_message:x[14], first_seen:isoAgo(x[13] + 8)
        }));
        const read = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || seed; } catch { return seed; } };
        const write = (leads) => localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
        if (!localStorage.getItem(STORAGE_KEY)) write(seed);
        const json = (data, status=200) => Promise.resolve(new Response(JSON.stringify(data), {status, headers:{'Content-Type':'application/json'}}));
        const originalFetch = window.fetch.bind(window);
        window.fetch = async (input, init={}) => {
          const url = String(typeof input === 'string' ? input : input.url || '');
          if (!url.startsWith('demo://netzen-crm')) return originalFetch(input, init);
          if ((init.method || 'GET').toUpperCase() === 'GET') {
            const query = new URL(url).searchParams;
            const action = query.get('action');
            if (action === 'leads') return json({ok:true, leads:read()});
            if (action === 'catalogs') return json({ok:true, catalogs:{
              business_models:['Venta directa','Multinivel','Retail','Franquicias','E-commerce','Punto de venta'],
              routes:['A','B','C','D','E'], owners:['Irving','Ana López'],
              countries:['MX','CO','PE','ES']
            }});
            if (action === 'touchEvents') {
              const id = query.get('lead_id'); const lead = read().find(x => x.lead_id === id);
              const events = !lead || !lead.last_touch_at ? [] : [{event_id:'DEMO-EVT-'+id,lead_id:id,channel:'manual',event_at:lead.last_touch_at,previous_stage:'nuevo',actor:'dashboard-internal'}];
              return json({ok:true, events});
            }
            return json({ok:true});
          }
          let body={}; try { body=JSON.parse(init.body || '{}'); } catch {}
          const leads=read(); const index=leads.findIndex(x=>x.lead_id===body.lead_id);
          if(index<0) return json({ok:false,error:'Prospecto de demostración no encontrado'},404);
          if(body.action==='updateLead') leads[index]={...leads[index],[body.field]:body.value,updated_at:new Date().toISOString(),last_touch_at:new Date().toISOString()};
          if(body.action==='editLead') leads[index]={...leads[index],...(body.changes||{}),updated_at:new Date().toISOString()};
          if(body.action==='archiveLead') leads[index]={...leads[index],flags:`[[CRM_ARCHIVE:v1|reason=${body.reason||'Demostración'}|actor=demo|at=${new Date().toISOString()}]]`};
          if(body.action==='restoreLead') leads[index]={...leads[index],flags:''};
          write(leads); return json({ok:true,lead:leads[index]});
        };
      })();
    </script>
